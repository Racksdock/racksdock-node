name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: racksdock-node }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/racksdock-subnet", path: racksdock-subnet }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e racksdock-subnet -e "racksdock-node[test,dev]"
      - run: cd racksdock-node && ruff check src tests && pytest
