# GPUs, NVSwitches and data NVMe controllers are bound to vfio-pci by scripts/bind-vfio.sh at boot.
# The NVIDIA host driver must never load for passthrough devices.
blacklist nvidia
blacklist nvidia_drm
blacklist nvidia_modeset
blacklist nouveau
options vfio-pci disable_vga=1
softdep nvme pre: vfio-pci
