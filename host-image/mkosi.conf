[Distribution]
Distribution=ubuntu
Release=noble

[Output]
Format=disk
ImageId=racksdock-host
Bootable=yes

[Content]
Packages=
  linux-image-generic
  systemd-boot
  qemu-system-x86
  qemu-utils
  libvirt-daemon-system
  libvirt-clients
  ovmf
  nvme-cli
  pciutils
  dmidecode
  bridge-utils
  chrony
  openssh-server
  python3
  python3-venv
  ufw
KernelCommandLine=intel_iommu=on iommu=pt default_hugepagesz=1G hugepagesz=1G hugepages=1850 rd.driver.pre=vfio-pci
ExtraTrees=mkosi.extra
PostInstallationScripts=scripts/postinstall.sh
