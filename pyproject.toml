[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "racksdock-node"
version = "0.1.0"
description = "8xB300 subnet: software for the miner's server (host-agent, turnkey host image) and the VM images (node-agent, image catalog)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["racksdock-subnet", "pydantic>=2.5", "websockets>=12", "pycdlib>=1.14", "pyyaml>=6", "typer>=0.12"]

[project.optional-dependencies]
nvml = ["nvidia-ml-py>=12"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
dev = ["ruff>=0.5"]

[project.scripts]
racksdock-host-agent = "racksdock_node.host_agent.main:main"
racksdock-node-agent = "racksdock_node.node_agent.main:main"
racksdock-container-init = "racksdock_node.node_agent.containerinit:main"
racksdock-images = "racksdock_node.images.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "E501", "RUF012", "SIM115", "SIM108", "SIM105", "RUF015", "RUF059", "RUF002", "RUF006", "RUF007", "B904", "B905", "B007"]
